<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1030"/>
    </linearGradient>
    <filter id="blob" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="gblur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- aurora blobs -->
  <g filter="url(#blob)">
    <circle cx="300" cy="320" r="220" fill="#22d3ee" opacity=".85"/>
    <circle cx="820" cy="300" r="200" fill="#a855f7" opacity=".85"/>
    <circle cx="760" cy="820" r="230" fill="#ec4899" opacity=".8"/>
    <circle cx="250" cy="800" r="210" fill="#6366f1" opacity=".8"/>
  </g>

  <!-- glass NW -->
  <g transform="translate(540 548) scale(7.9) translate(-50 -50)"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- soft shadow under glass -->
    <g transform="translate(0 1.6)" stroke="#0a0a1f" stroke-opacity=".4" stroke-width="11" filter="url(#gblur)">
      <path d="M10 82 V18 L46 82 V18"/><path d="M54 18 L62 82 L72 46 L82 82 L90 18"/>
    </g>
    <!-- frosted body -->
    <g stroke="#ffffff" stroke-opacity=".16" stroke-width="11">
      <path d="M10 82 V18 L46 82 V18"/><path d="M54 18 L62 82 L72 46 L82 82 L90 18"/>
    </g>
    <!-- bright rim -->
    <g stroke="url(#rim)" stroke-width="2.4" stroke-opacity=".85">
      <path d="M10 82 V18 L46 82 V18"/><path d="M54 18 L62 82 L72 46 L82 82 L90 18"/>
    </g>
    <!-- top gloss -->
    <g transform="translate(0 -2.6)" stroke="#ffffff" stroke-opacity=".7" stroke-width="2">
      <path d="M10 82 V18 L46 82 V18"/><path d="M54 18 L62 82 L72 46 L82 82 L90 18"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path transform="translate(800 312) scale(1.4)" opacity=".95" d="M0 -22C2.4 -6 5.6 -2.4 22 0C5.6 2.4 2.4 5.6 0 22C-2.4 5.6 -5.6 2.4 -22 0C-5.6 -2.4 -2.4 -5.6 0 -22Z"/>
    <path transform="translate(286 772) scale(.8)" opacity=".8" d="M0 -22C2.4 -6 5.6 -2.4 22 0C5.6 2.4 2.4 5.6 0 22C-2.4 5.6 -5.6 2.4 -22 0C-5.6 -2.4 -2.4 -5.6 0 -22Z"/>
  </g>
</svg>
