<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset=".42" stop-color="#9b5cff"/>
      <stop offset=".72" stop-color="#e24bd8"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <radialGradient id="hi" cx="30%" cy="22%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="62%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a0b4a" stop-opacity=".34"/>
    </radialGradient>
    <linearGradient id="nwfill" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe9f4"/>
    </linearGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3a0a52" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#hi)"/>

  <!-- thin orbit accent -->
  <g transform="translate(540 540)" fill="none" stroke="#ffffff">
    <ellipse rx="392" ry="392" stroke-opacity=".18" stroke-width="2"/>
    <ellipse rx="392" ry="392" stroke-opacity=".5" stroke-width="2" stroke-dasharray="2.5 1200" stroke-dashoffset="-260"/>
  </g>

  <!-- NW monogram, white, soft 3D shadow -->
  <g transform="translate(540 548) scale(8.0) translate(-50 -50)" fill="none"
     stroke="url(#nwfill)" stroke-width="9.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#ds)">
    <path d="M10 82 V18 L46 82 V18"/>
    <path d="M54 18 L62 82 L72 46 L82 82 L90 18"/>
  </g>

  <!-- spark -->
  <path transform="translate(792 318) scale(1.5)" fill="#ffffff" opacity=".95"
    d="M0 -24C2.6 -6 6 -2.6 24 0C6 2.6 2.6 6 0 24C-2.6 6 -6 2.6 -24 0C-6 -2.6 -2.6 -6 0 -24Z"/>

  <rect width="1080" height="1080" fill="url(#vig)"/>
</svg>
