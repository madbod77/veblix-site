<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#16181f"/>
      <stop offset=".6" stop-color="#0b0c11"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf0c4"/>
      <stop offset=".35" stop-color="#e7c570"/>
      <stop offset=".6" stop-color="#bd9333"/>
      <stop offset=".8" stop-color="#f4dd92"/>
      <stop offset="1" stop-color="#a9781f"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- emblem rings -->
  <g transform="translate(540 540)" fill="none" stroke="url(#gold)">
    <circle r="468" stroke-width="2" opacity=".55"/>
    <circle r="452" stroke-width="6" opacity=".9"/>
    <circle r="436" stroke-width="1.4" opacity=".5"/>
  </g>

  <!-- side accent dots -->
  <g fill="url(#gold)">
    <circle cx="468" cy="540" r="5"/><circle cx="612" cy="540" r="5"/>
  </g>

  <!-- NW modernist (geometric / Bauhaus) monogram -->
  <g transform="translate(540 506) scale(7.4) translate(-51 -50)"
     fill="none" stroke="url(#gold)" stroke-width="4.6"
     stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="8">
    <path d="M12 78 V22 L46 78 V22"/>
    <path d="M52 22 L61 78 L71 44 L81 78 L90 22"/>
  </g>

  <!-- wordmark -->
  <text x="540" y="852" text-anchor="middle"
        font-family="'Sora','Segoe UI',sans-serif" font-size="58" font-weight="600"
        letter-spacing="20" fill="url(#gold)">NOVAWEB</text>
  <text x="540" y="904" text-anchor="middle"
        font-family="'Segoe UI',sans-serif" font-size="22" font-weight="500"
        letter-spacing="11" fill="#c9a85f" opacity=".75">WEB&#160;STUDIO</text>
</svg>
