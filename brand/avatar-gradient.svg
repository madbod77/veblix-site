<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset=".48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="24%" cy="18%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="84%" cy="88%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="50%" cy="46%" r="66%">
      <stop offset="0" stop-color="#1a1147" stop-opacity="0"/>
      <stop offset="1" stop-color="#160b3d" stop-opacity=".34"/>
    </radialGradient>
    <linearGradient id="nfill" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eeff"/>
    </linearGradient>
    <radialGradient id="fade" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1080" height="1080" fill="url(#fade)"/></mask>
    <pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M90 0H0V90" fill="none" stroke="#ffffff" stroke-width="1.4"/>
    </pattern>
    <filter id="nshadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#140a3a" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- base gradient + light -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glowTL)"/>
  <rect width="1080" height="1080" fill="url(#glowBR)"/>

  <!-- faint cosmic grid -->
  <rect width="1080" height="1080" fill="url(#grid)" opacity=".14" mask="url(#gridmask)"/>

  <!-- orbit ring + planet -->
  <g transform="translate(540 540)" fill="none">
    <circle r="362" stroke="#ffffff" stroke-opacity=".20" stroke-width="2"/>
    <circle r="362" stroke="#ffffff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 1100" stroke-dashoffset="-150"/>
    <g transform="rotate(-32) translate(362 0)">
      <circle r="14" fill="#ffffff" filter="url(#soft)" opacity=".7"/>
      <circle r="10" fill="#ffffff"/>
    </g>
  </g>

  <!-- N monogram -->
  <g transform="translate(540 540) scale(22) translate(-16 -16)"
     fill="none" stroke="url(#nfill)" stroke-width="3.1"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#nshadow)">
    <path d="M6 24V8l20 16V8"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path transform="translate(742 322) scale(1.5)" opacity=".95"
      d="M0 -22C2.6 -6 6 -2.6 22 0C6 2.6 2.6 6 0 22C-2.6 6 -6 2.6 -22 0C-6 -2.6 -2.6 -6 0 -22Z"/>
    <path transform="translate(330 712) scale(.85)" opacity=".8"
      d="M0 -22C2.6 -6 6 -2.6 22 0C6 2.6 2.6 6 0 22C-2.6 6 -6 2.6 -22 0C-6 -2.6 -2.6 -6 0 -22Z"/>
  </g>

  <!-- vignette for depth -->
  <rect width="1080" height="1080" fill="url(#vign)"/>
</svg>
