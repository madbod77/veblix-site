<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset=".55" stop-color="#9333ea"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="hi" cx="28%" cy="20%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2a0a3a" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#hi)"/>

  <!-- confetti dots -->
  <g fill="#ffffff" opacity=".8">
    <circle cx="170" cy="210" r="9"/><circle cx="910" cy="180" r="7"/>
    <circle cx="940" cy="860" r="9"/><circle cx="160" cy="880" r="7"/>
    <circle cx="120" cy="520" r="6"/><circle cx="980" cy="540" r="6"/>
  </g>

  <g transform="translate(540 548) scale(7.7) translate(-50 -50)"
     fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#ds)">
    <!-- white sticker outline -->
    <g stroke="#ffffff" stroke-width="15.5">
      <path d="M10 82 V18 L46 82 V18"/><path d="M54 18 L62 82 L72 46 L82 82 L90 18"/>
    </g>
    <!-- bright gradient fill -->
    <g stroke="url(#fill)" stroke-width="9.4">
      <path d="M10 82 V18 L46 82 V18"/><path d="M54 18 L62 82 L72 46 L82 82 L90 18"/>
    </g>
    <!-- top gloss -->
    <g transform="translate(0 -1.4)" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.4">
      <path d="M10 82 V18 L46 82 V18"/><path d="M54 18 L62 82 L72 46 L82 82 L90 18"/>
    </g>
  </g>

  <path transform="translate(800 300) scale(1.7)" fill="#ffffff"
    d="M0 -22C2.4 -6 5.6 -2.4 22 0C5.6 2.4 2.4 5.6 0 22C-2.4 5.6 -5.6 2.4 -22 0C-5.6 -2.4 -2.4 -5.6 0 -22Z"/>
</svg>
