<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#10183a"/>
      <stop offset=".6" stop-color="#080d20"/>
      <stop offset="1" stop-color="#03050d"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9bdff"/>
      <stop offset=".45" stop-color="#5b6cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- emblem rings -->
  <g transform="translate(540 540)" fill="none" stroke="url(#blue)">
    <circle r="468" stroke-width="2" opacity=".5"/>
    <circle r="452" stroke-width="6" opacity=".9"/>
    <circle r="436" stroke-width="1.4" opacity=".45"/>
  </g>

  <!-- side accent dots -->
  <g fill="url(#blue)"><circle cx="468" cy="540" r="5"/><circle cx="612" cy="540" r="5"/></g>

  <!-- NW modernist (geometric / Bauhaus) -->
  <g transform="translate(540 506) scale(7.4) translate(-51 -50)"
     fill="none" stroke="url(#blue)" stroke-width="4.6"
     stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="8">
    <path d="M12 78 V22 L46 78 V22"/>
    <path d="M52 22 L61 78 L71 44 L81 78 L90 22"/>
  </g>

  <!-- wordmark -->
  <text x="540" y="852" text-anchor="middle"
        font-family="'Sora','Segoe UI',sans-serif" font-size="58" font-weight="600"
        letter-spacing="20" fill="url(#blue)">NOVAWEB</text>
  <text x="540" y="904" text-anchor="middle"
        font-family="'Segoe UI',sans-serif" font-size="22" font-weight="500"
        letter-spacing="11" fill="#7e93d8" opacity=".8">WEB&#160;STUDIO</text>
</svg>
