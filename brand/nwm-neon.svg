<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#0a1130"/>
      <stop offset=".6" stop-color="#05081a"/>
      <stop offset="1" stop-color="#02030a"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowS" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- ring glow + crisp -->
  <g transform="translate(540 540)" fill="none">
    <circle r="452" stroke="url(#neon)" stroke-width="9" filter="url(#glow)" opacity=".8"/>
    <circle r="452" stroke="url(#neon)" stroke-width="4"/>
    <circle r="468" stroke="url(#neon)" stroke-width="1.6" opacity=".4"/>
  </g>

  <g fill="#9be8ff" filter="url(#glowS)"><circle cx="468" cy="540" r="6"/><circle cx="612" cy="540" r="6"/></g>

  <!-- NW glow then crisp -->
  <g transform="translate(540 506) scale(7.4) translate(-51 -50)"
     fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="8">
    <g stroke="url(#neon)" stroke-width="6.6" filter="url(#glow)" opacity=".9">
      <path d="M12 78 V22 L46 78 V22"/><path d="M52 22 L61 78 L71 44 L81 78 L90 22"/>
    </g>
    <g stroke="url(#neon)" stroke-width="4.6">
      <path d="M12 78 V22 L46 78 V22"/><path d="M52 22 L61 78 L71 44 L81 78 L90 22"/>
    </g>
    <g stroke="#eaffff" stroke-width="1.4" opacity=".85">
      <path d="M12 78 V22 L46 78 V22"/><path d="M52 22 L61 78 L71 44 L81 78 L90 22"/>
    </g>
  </g>

  <text x="540" y="852" text-anchor="middle"
        font-family="'Sora','Segoe UI',sans-serif" font-size="58" font-weight="600"
        letter-spacing="20" fill="url(#neon)">NOVAWEB</text>
  <text x="540" y="904" text-anchor="middle"
        font-family="'Segoe UI',sans-serif" font-size="22" font-weight="500"
        letter-spacing="11" fill="#67e8f9" opacity=".75">WEB&#160;STUDIO</text>
</svg>
